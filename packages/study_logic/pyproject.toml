[project]
name = "study-logic"
version = "0.1.0"
description = "Notbook S0+S1 study engine — FastAPI router for Backend :8000"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
