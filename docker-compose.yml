# Self-hosted S0 demo — loopback only. No auth, ingress, or k8s.
#   docker compose pull && docker compose up
#   curl -fsS http://127.0.0.1:8000/health
#   open http://127.0.0.1:3000
#
# Optional web supplement (SearXNG, profile `supplement` — not started by default):
#   SEARXNG_URL=http://searxng:8080 docker compose --profile supplement up
#   Then POST /api/v1/notebooks/{id}/quizzes with {"supplement": true}
name: notbook

services:
  api:
    image: ghcr.io/charlieadair/notbook/api:${NOTBOOK_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /data
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-stub}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
    volumes:
      - notbook-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: ghcr.io/charlieadair/notbook/web:${NOTBOOK_TAG:-latest}
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # Opt-in only. Study-logic reads SEARXNG_URL; unset/down → vault-only + warning.
  searxng:
    profiles: ["supplement"]
    image: docker.io/searxng/searxng:latest
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  notbook-data:
