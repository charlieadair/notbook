# Build and publish public GHCR images for the local S0 demo.
# Does not deploy ingress, k8s, or Cloudflare.
name: Publish GHCR images

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - "backend/**"
      - "packages/study_logic/**"
      - "web/**"
      - ".github/workflows/ghcr.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - "backend/**"
      - "packages/study_logic/**"
      - "web/**"
      - ".github/workflows/ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start compose stack
        run: docker compose up -d --build

      - name: Wait for /health and UI
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              curl -fsS http://127.0.0.1:8000/health
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down

  publish:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}/api:latest
            ${{ env.IMAGE }}/api:s0
            ${{ env.IMAGE }}:api
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}/web:latest
            ${{ env.IMAGE }}/web:s0
            ${{ env.IMAGE }}:web
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push all-in-one
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:s0
          cache-from: type=gha,scope=allinone
          cache-to: type=gha,mode=max,scope=allinone

      - name: Make packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          for pkg in "${repo}" "${repo}/api" "${repo}/web"; do
            encoded="$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$pkg")"
            echo "Setting visibility public for ${pkg}"
            gh api --method PUT \
              "/users/${owner}/packages/container/${encoded}/visibility" \
              -f visibility=public \
              || gh api --method POST \
              "/users/${owner}/packages/container/${encoded}/visibility" \
              -f visibility=public \
              || echo "Could not change visibility for ${pkg} (may already be public, or token lacks packages admin)."
          done
